# nginx site for the Siddhrans static website + contact API.
# Install as /etc/nginx/conf.d/siddhrans.conf, replacing the server names and certificate paths.
# This file is a TEMPLATE; nothing in the repository applies it for you.

# Rate limit for the enquiry endpoint (http context; the conf.d include already sits inside http{}).
limit_req_zone $binary_remote_addr zone=siddhrans_contact:10m rate=10r/m;

# Plain HTTP: serve the ACME challenge, redirect everything else to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name siddhrans.com www.siddhrans.com;

    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name siddhrans.com www.siddhrans.com;

    # Certificates (see docs/DEPLOYMENT.md, "HTTPS").
    ssl_certificate     /etc/letsencrypt/live/siddhrans.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/siddhrans.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Static export produced by `npm run build`; /var/www/siddhrans/current is a symlink to a release folder.
    root /var/www/siddhrans/current;
    index index.html;
    error_page 404 /404.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;
    # brotli on; brotli_types text/css application/javascript application/json image/svg+xml;   # only if ngx_brotli is installed

    # Security headers. nginx does not inherit add_header into a location that sets its own,
    # so the set is repeated in "location /" below. Static assets locations set only caching.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # Enable once HTTPS works on every hostname (browsers remember it):
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Pages: always revalidate so a new release is visible immediately.
    location / {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }

    # Fingerprinted build assets never change: cache for a year.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Photographs, the official logo and the social-sharing image.
    location ~ ^/(img|brand|og)/ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Contact API (Node service on 127.0.0.1:8787). The website posts to /api/contact.
    location /api/ {
        client_max_body_size 32k;
        limit_req zone=siddhrans_contact burst=5 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # the API trusts this header when TRUST_PROXY=true
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 20s;
        add_header Cache-Control "no-store" always;
    }

    location ~ /\.(?!well-known) { deny all; }
}
